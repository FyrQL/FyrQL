# The sources, views and settings of the engine that the JDBC driver builds for each
# connection, with the URL jdbc:fyrql:?config=fyrql.yaml

sources:
  # The orders in a database, here an H2 file under target/db, which the example creates.
  # The password comes from the environment variable SALES_PASSWORD.
  - name: sales
    type: jdbc
    url: jdbc:h2:./target/db/sales;DATABASE_TO_LOWER=TRUE
    user: sales
    password: ${env:SALES_PASSWORD}
    # Only the tables of this schema; H2 would show its information_schema too.
    schemas: public
  # The customers in CSV files, in the directory that DATA_DIR names, or else in data.
  # A relative directory is resolved against the directory of this file.
  - name: files
    type: csv
    directory: ${env:DATA_DIR:-data}

views:
  # The revenue of each customer over both sources, which every connection sees as a
  # table of sales. orders resolves along the default source when the engine is built.
  - name: sales.main.customer_revenue
    sql: |
      SELECT c.name, c.region, count(*) AS orders, sum(o.amount) AS revenue
      FROM orders AS o JOIN files.customers AS c ON o.customer_id = c.id
      GROUP BY c.name, c.region

engine:
  defaultSource: sales
  threads: 2
