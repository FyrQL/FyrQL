# The database of the application, which Spring Boot fills from schema.sql and data.sql.
spring:
  datasource:
    url: jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""

# The engine of FyrQL: the customers in CSV files under data; the database of the
# application joins it as the source shop in ShopApplication.
fyrql:
  engine:
    threads: 2
  sources:
    - name: files
      type: csv
      directory: data
  # A DataSource of the engine, the bean fyrqlDataSource, beside that of the application.
  datasource:
    enabled: true

management:
  endpoint:
    health:
      show-details: always
