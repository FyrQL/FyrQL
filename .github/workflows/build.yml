name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # A new version in the POMs changes the key; the restore key then starts from the last
      # cache, so that only new dependencies are downloaded.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-${{ runner.os }}-
      # Maven retries only 429 and 503 by default; Maven Central sometimes answers 502 or 504. The
      # profile examples builds and tests the examples against the modules of this build; the
      # profile containers runs the tests against MySQL in the Docker of the runner as well.
      - run: >-
          ./mvnw -B -ntp
          -Daether.connector.http.retryHandler.count=5
          -Daether.connector.http.retryHandler.serviceUnavailable=429,502,503,504
          -Pexamples,containers
          verify
      # The version of the POMs, which names the JARs, and that of HSQLDB, whose driver from the
      # tests the smoke tests of the images take.
      - id: version
        run: |
          evaluate() {
            ./mvnw -B -ntp -q -DforceStdout -Daether.connector.http.retryHandler.count=5 \
              -Daether.connector.http.retryHandler.serviceUnavailable=429,502,503,504 \
              help:evaluate -Dexpression="$1"
          }
          echo "version=$(evaluate project.version)" >> "$GITHUB_OUTPUT"
          echo "hsqldb=$(evaluate hsqldb.version)" >> "$GITHUB_OUTPUT"
      # The JARs of both servers in the contexts of their images, and the JDBC driver of HSQLDB,
      # which the smoke tests of the images put on the class path of the servers.
      - name: Collect the JARs of the images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HSQLDB: ${{ steps.version.outputs.hsqldb }}
        run: |
          mkdir -p target/images/pgwire target/images/flight-sql target/images/drivers
          cp "fyrql-pgwire-all/target/fyrql-pgwire-all-$VERSION.jar" target/images/pgwire/
          cp "fyrql-flight-sql-all/target/fyrql-flight-sql-all-$VERSION.jar" target/images/flight-sql/
          cp ~/.m2/repository/org/hsqldb/hsqldb/"$HSQLDB/hsqldb-$HSQLDB.jar" target/images/drivers/
          ls -lR target/images
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: target/images
          if-no-files-found: error
          retention-days: 7

  # Builds the images of both servers and runs their smoke tests on every run, but publishes
  # nothing; publish-images does, from the tag 1.0.0 on.
  images:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: images
          path: target/images
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the image of the PostgreSQL wire protocol server
        uses: docker/build-push-action@v6
        with:
          context: target/images/pgwire
          file: fyrql-pgwire-all/src/main/docker/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          platforms: linux/amd64
          pull: true
          load: true
          tags: fyrql-pgwire:smoke
          cache-from: type=gha,scope=pgwire
          cache-to: type=gha,mode=max,scope=pgwire
      - name: Build the image of the Flight SQL server
        uses: docker/build-push-action@v6
        with:
          context: target/images/flight-sql
          file: fyrql-flight-sql-all/src/main/docker/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          platforms: linux/amd64
          pull: true
          load: true
          tags: fyrql-flight-sql:smoke
          cache-from: type=gha,scope=flight-sql
          cache-to: type=gha,mode=max,scope=flight-sql
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install psql and ADBC
        run: |
          command -v psql || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          python -m pip install --disable-pip-version-check adbc-driver-flightsql pyarrow
      - name: Smoke tests
        env:
          PYTHON: python
        run: bash .github/docker/smoke.sh fyrql-pgwire:smoke fyrql-flight-sql:smoke target/images/drivers
      # As publish-images builds them, for amd64 and arm64, without pushing them anywhere.
      - name: Build the image of the PostgreSQL wire protocol server for both platforms
        uses: docker/build-push-action@v6
        with:
          context: target/images/pgwire
          file: fyrql-pgwire-all/src/main/docker/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=pgwire
          outputs: type=cacheonly
      - name: Build the image of the Flight SQL server for both platforms
        uses: docker/build-push-action@v6
        with:
          context: target/images/flight-sql
          file: fyrql-flight-sql-all/src/main/docker/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=flight-sql
          outputs: type=cacheonly
      - name: Tell whether this run publishes the images
        run: >-
          echo "Publish the images: ${{ github.repository == 'FyrQL/FyrQL' && github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, '0.')
          && !endsWith(needs.verify.outputs.version, '-SNAPSHOT') }} (${{ github.event_name }} of
          ${{ github.ref }}, version $VERSION; only the tag of a version from 1.0.0 on publishes)"

  # Publishes the images in the GitHub Container Registry for the tag of a release from 1.0.0
  # on: no branch, pull request, manual run, fork or tag of a version 0.x does.
  publish-images:
    needs: [verify, images]
    if: >-
      github.repository == 'FyrQL/FyrQL' && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, '0.')
      && !endsWith(needs.verify.outputs.version, '-SNAPSHOT')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check that the tag is the version of the POMs
        run: >-
          [ "$GITHUB_REF_NAME" = "$VERSION" ] ||
          { echo "::error::The tag $GITHUB_REF_NAME is not the version $VERSION of the POMs"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: images
          path: target/images
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 1.2.3 gets the tags 1.2.3, 1.2, 1 and latest; a version such as 1.2.3-rc1 only its own.
      - id: pgwire-tags
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fyrql/fyrql-pgwire
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - id: flight-sql-tags
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fyrql/fyrql-flight-sql
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - id: pgwire
        name: Publish the image of the PostgreSQL wire protocol server
        uses: docker/build-push-action@v6
        with:
          context: target/images/pgwire
          file: fyrql-pgwire-all/src/main/docker/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.pgwire-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - id: flight-sql
        name: Publish the image of the Flight SQL server
        uses: docker/build-push-action@v6
        with:
          context: target/images/flight-sql
          file: fyrql-flight-sql-all/src/main/docker/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.flight-sql-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
      # Signed attestations of where the images come from, which gh attestation verify checks.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/fyrql/fyrql-pgwire
          subject-digest: ${{ steps.pgwire.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/fyrql/fyrql-flight-sql
          subject-digest: ${{ steps.flight-sql.outputs.digest }}
          push-to-registry: true
      # The smoke tests again, on the images as the registry holds them.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install psql and ADBC
        run: |
          command -v psql || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          python -m pip install --disable-pip-version-check adbc-driver-flightsql pyarrow
      - name: Smoke tests of the published images
        env:
          PYTHON: python
        run: >-
          bash .github/docker/smoke.sh
          "ghcr.io/fyrql/fyrql-pgwire@${{ steps.pgwire.outputs.digest }}"
          "ghcr.io/fyrql/fyrql-flight-sql@${{ steps.flight-sql.outputs.digest }}"
          target/images/drivers
